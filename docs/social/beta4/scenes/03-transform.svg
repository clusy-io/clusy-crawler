<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Page HTML to clean Markdown</title>
  <desc id="desc">A source HTML card flows into a clean Markdown card.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdfa"/>
      <stop offset="1" stop-color="#f4eee7"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#8a4b22" stroke-opacity="0.05"/>
    </pattern>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#3d2618" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a4b22"/>
      <stop offset="1" stop-color="#17d1a6"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#paper)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <image href="clusy-logo.png" x="100" y="76" width="270" height="66" preserveAspectRatio="xMinYMid meet"/>

  <text x="960" y="232" text-anchor="middle" fill="#0b0d10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="-2.8">PAGE HTML → CLEAN MARKDOWN</text>
  <text x="960" y="294" text-anchor="middle" fill="#57534e" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="31">A deterministic local path. A result you can inspect.</text>

  <g transform="translate(100 365)" filter="url(#shadow)">
    <rect width="720" height="470" rx="30" fill="#0b0d10"/>
    <g transform="translate(34 31)">
      <circle cx="10" cy="10" r="8" fill="#c97145"/>
      <circle cx="38" cy="10" r="8" fill="#d7b66b"/>
      <circle cx="66" cy="10" r="8" fill="#67aa86"/>
      <text x="590" y="17" text-anchor="end" fill="#8a8580" font-family="Menlo, SFMono-Regular, monospace" font-size="17">SOURCE HTML</text>
    </g>
    <g transform="translate(45 100)" font-family="Menlo, SFMono-Regular, monospace" font-size="23">
      <text x="0" y="0" fill="#c97145">&lt;nav&gt;…&lt;/nav&gt;</text>
      <text x="0" y="49" fill="#8a8580">&lt;aside class="promo"&gt;…&lt;/aside&gt;</text>
      <text x="0" y="98" fill="#17d1a6">&lt;article&gt;</text>
      <text x="38" y="147" fill="#fffdfa">&lt;h1&gt;A cleaner web pipeline&lt;/h1&gt;</text>
      <text x="38" y="196" fill="#fffdfa">&lt;p&gt;Useful content begins here.&lt;/p&gt;</text>
      <text x="0" y="245" fill="#17d1a6">&lt;/article&gt;</text>
      <text x="0" y="294" fill="#8a8580">&lt;script&gt;…&lt;/script&gt;</text>
    </g>
  </g>

  <g transform="translate(866 555)">
    <path d="M0 0H150" stroke="url(#flow)" stroke-width="9" stroke-linecap="round"/>
    <path d="m126-24 28 24-28 24" fill="none" stroke="#17d1a6" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="26" cy="0" r="11" fill="#8a4b22"/>
    <circle cx="76" cy="0" r="11" fill="#6f8b68"/>
    <circle cx="126" cy="0" r="11" fill="#17d1a6"/>
  </g>

  <g transform="translate(1060 365)" filter="url(#shadow)">
    <rect width="760" height="470" rx="30" fill="#fffdfa" stroke="#17d1a6" stroke-width="3"/>
    <g transform="translate(40 42)">
      <text x="0" y="0" fill="#2e7a55" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2.3">CLEAN MARKDOWN</text>
      <text x="0" y="98" fill="#0b0d10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="49" font-weight="800"># A cleaner web pipeline</text>
      <text x="0" y="180" fill="#57534e" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34">Useful content begins here.</text>
      <line x1="0" y1="230" x2="665" y2="230" stroke="#d8ccc2" stroke-width="2"/>
      <g transform="translate(0 277)">
        <circle cx="11" cy="11" r="11" fill="#17d1a6"/>
        <text x="40" y="21" fill="#57534e" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28">main content preserved</text>
      </g>
      <g transform="translate(0 337)">
        <circle cx="11" cy="11" r="11" fill="#17d1a6"/>
        <text x="40" y="21" fill="#57534e" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28">route + completeness returned</text>
      </g>
    </g>
  </g>

  <g transform="translate(647 920)">
    <rect width="626" height="72" rx="36" fill="#edf8f4" stroke="#9ed7c5" stroke-width="2"/>
    <circle cx="43" cy="36" r="10" fill="#17d1a6"/>
    <text x="70" y="46" fill="#2e7a55" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" font-weight="700">Deterministic path · no model required</text>
  </g>
</svg>
