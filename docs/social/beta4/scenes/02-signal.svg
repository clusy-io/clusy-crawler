<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">It needs the signal</title>
  <desc id="desc">Clusy highlights the article while page noise fades away.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdfa"/>
      <stop offset="1" stop-color="#f4eee7"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#17d1a6" stroke-opacity="0.05"/>
    </pattern>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#153d32" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#paper)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <path d="M-80 820C240 700 480 790 740 1160H-80Z" fill="#17d1a6" opacity="0.045"/>
  <image href="clusy-logo.png" x="100" y="76" width="270" height="66" preserveAspectRatio="xMinYMid meet"/>

  <g transform="translate(100 250)">
    <text x="0" y="0" fill="#2e7a55" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="3.5">SOURCE-DERIVED EXTRACTION</text>
    <text x="0" y="122" fill="#0b0d10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="100" font-weight="800" letter-spacing="-4">IT NEEDS</text>
    <text x="0" y="228" fill="#0b0d10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="100" font-weight="800" letter-spacing="-4">THE SIGNAL.</text>
    <text x="3" y="320" fill="#57534e" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" font-weight="500">Keep useful content.</text>
    <text x="3" y="370" fill="#57534e" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="36" font-weight="500">Keep the provenance.</text>
    <g transform="translate(0 462)">
      <rect width="295" height="58" rx="29" fill="#edf8f4" stroke="#9ed7c5" stroke-width="2"/>
      <circle cx="30" cy="29" r="8" fill="#17d1a6"/>
      <text x="54" y="37" fill="#2e7a55" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" font-weight="700">Bounded at every stage</text>
    </g>
  </g>

