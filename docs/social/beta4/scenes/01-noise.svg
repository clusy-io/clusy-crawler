<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Your agent does not need the whole page</title>
  <desc id="desc">A noisy synthetic web page beside the Clusy wordmark.</desc>
  <defs>
