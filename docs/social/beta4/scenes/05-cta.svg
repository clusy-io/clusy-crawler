<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Clusy Crawler Beta 4</title>
  <desc id="desc">Call to try Clusy Crawler on difficult real-world pages.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdfa"/>
      <stop offset="1" stop-color="#f4eee7"/>
    </linearGradient>
    <radialGradient id="mintGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#17d1a6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#17d1a6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#17d1a6" stroke-opacity="0.055"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#paper)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <circle cx="960" cy="520" r="620" fill="url(#mintGlow)"/>
  <circle cx="110" cy="180" r="14" fill="#17d1a6" opacity="0.8"/>
  <circle cx="1760" cy="238" r="10" fill="#17d1a6" opacity="0.55"/>
  <circle cx="1685" cy="886" r="16" fill="#17d1a6" opacity="0.72"/>
  <circle cx="264" cy="900" r="8" fill="#17d1a6" opacity="0.48"/>

  <image href="clusy-logo.png" x="720" y="162" width="480" height="116" preserveAspectRatio="xMidYMid meet"/>
  <text x="960" y="382" text-anchor="middle" fill="#8a4b22" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="4">CLUSY CRAWLER · OPEN-SOURCE BETA 4</text>
  <text x="960" y="516" text-anchor="middle" fill="#0b0d10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="-2.8">BRING US THE PAGES</text>
  <text x="960" y="606" text-anchor="middle" fill="#0b0d10" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" letter-spacing="-2.8">THAT BREAK EVERYTHING.</text>

  <g transform="translate(451 683)">
    <rect width="1018" height="92" rx="46" fill="#0b0d10"/>
    <circle cx="55" cy="46" r="12" fill="#17d1a6"/>
    <text x="92" y="59" fill="#fffdfa" font-family="Menlo, SFMono-Regular, monospace" font-size="31" font-weight="700">github.com/clusy-io/clusy-crawler</text>
    <path d="m945 34 16 12-16 12M925 46h34" fill="none" stroke="#17d1a6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(532 842)" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="24" font-weight="700">
    <g>
      <rect width="242" height="62" rx="31" fill="#fffdfa" stroke="#b9aa9c" stroke-width="2"/>
      <text x="121" y="40" text-anchor="middle" fill="#57534e">Apache-2.0</text>
    </g>
    <g transform="translate(272)">
      <rect width="270" height="62" rx="31" fill="#fffdfa" stroke="#b9aa9c" stroke-width="2"/>
      <text x="135" y="40" text-anchor="middle" fill="#57534e">Self-hosted</text>
    </g>
    <g transform="translate(572)">
      <rect width="322" height="62" rx="31" fill="#edf8f4" stroke="#9ed7c5" stroke-width="2"/>
      <text x="161" y="40" text-anchor="middle" fill="#2e7a55">No model required</text>
    </g>
  </g>

  <text x="960" y="1006" text-anchor="middle" fill="#8a8580" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22">Fast · bounded · source-derived · inspectable</text>
</svg>
