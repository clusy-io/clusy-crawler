<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Clusy Crawler Beta 4 Preview</title>
  <desc id="description">Fast, bounded, source-derived web extraction with a registered same-family AEB article-body comparison.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdfa"/>
      <stop offset="1" stop-color="#f4eee7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b25624"/>
      <stop offset="1" stop-color="#743a1d"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#8a4b23" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#5b321d" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#paper)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <path d="M905 -40C1095 72 1180 196 1240 392V-40Z" fill="#8a4b23" opacity="0.055"/>
  <path d="M-40 536C118 468 252 506 388 670H-40Z" fill="#2e7a55" opacity="0.045"/>

  <g transform="translate(70 55)">
    <image href="clusy-logo.png" x="0" y="-3" width="178" height="43" preserveAspectRatio="xMinYMid meet">
      <title>Clusy</title>
    </image>

    <g transform="translate(770 0)">
      <rect width="290" height="48" rx="24" fill="#fffdfa" stroke="#b9aa9c"/>
      <circle cx="25" cy="24" r="6" fill="#2e7a55"/>
      <text x="44" y="30" fill="#57534e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="1.25">OPEN SOURCE · BETA 4</text>
    </g>
  </g>

  <g transform="translate(70 145)">
    <text x="0" y="0" fill="#8a4b23" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17" font-weight="750" letter-spacing="2.2">CLUSY CRAWLER</text>
    <text x="0" y="66" fill="#1c1917" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="61" font-weight="790" letter-spacing="-2.4">Web extraction</text>
    <text x="0" y="132" fill="#1c1917" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="61" font-weight="790" letter-spacing="-2.4">you can inspect.</text>
    <text x="3" y="178" fill="#57534e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="500">Fast · bounded · source-derived · self-hosted</text>
  </g>

  <g transform="translate(660 145)" filter="url(#shadow)">
    <rect width="470" height="310" rx="28" fill="#fffdfa" stroke="#ded3ca"/>
    <text x="34" y="45" fill="#8a4b23" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="760" letter-spacing="1.35">REGISTERED AEB · SAME-FAMILY ARTICLE_BODY</text>
    <text x="34" y="128" fill="#1c1917" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="64" font-weight="800" letter-spacing="-2">0.972127</text>
    <text x="338" y="127" fill="#57534e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="650">F1</text>
    <line x1="34" y1="157" x2="436" y2="157" stroke="#ded3ca"/>
    <g transform="translate(34 186)">
      <rect width="195" height="76" rx="16" fill="#f4eee7"/>
      <text x="18" y="31" fill="#8a4b23" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="760">+0.014581</text>
      <text x="18" y="55" fill="#57534e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">vs exact Trafilatura 2.1.0</text>
    </g>
    <g transform="translate(241 186)">
      <rect width="195" height="76" rx="16" fill="#edf5f0"/>
      <text x="18" y="31" fill="#2e7a55" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="23" font-weight="760">173.97 pages/s</text>
      <text x="18" y="55" fill="#57534e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13">local in-memory extraction</text>
    </g>
  </g>

  <g transform="translate(70 500)">
    <rect width="157" height="38" rx="19" fill="#1c1917"/>
    <text x="22" y="25" fill="#fffdfa" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">Apache-2.0</text>
    <rect x="169" width="162" height="38" rx="19" fill="#fffdfa" stroke="#b9aa9c"/>
    <text x="191" y="25" fill="#57534e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">No model required</text>
    <rect x="343" width="175" height="38" rx="19" fill="#fffdfa" stroke="#b9aa9c"/>
    <text x="365" y="25" fill="#57534e" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700">3 image profiles</text>
  </g>

  <text x="70" y="579" fill="#716c67" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="650">Same-family comparison · pinned rs-trafilatura candidate vs Python Trafilatura 2.1.0 · registered Beta 2 receipt</text>
  <text x="70" y="600" fill="#8a8580" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12.5">AEB article_body · all 181 pages · throughput is local in-memory, not HTTP or service throughput</text>
</svg>
