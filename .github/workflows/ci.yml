name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          version: "0.11.6"

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Rust
        run: >-
          rustup toolchain install 1.85
          --profile minimal
          --component rustfmt
          --component clippy

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Mypy (types)
        run: uv run mypy app

      - name: Documentation
        run: uv run python scripts/check_docs.py

      - name: Benchmark evidence claims
        run: uv run python scripts/check_evidence_claims.py

      - name: Quality runtime dependency surface
        run: |
          uv export \
            --locked \
            --no-dev \
            --extra llm \
            --extra quality \
            --prune accelerate \
            --prune pytest \
            --prune pytest-asyncio \
            --no-emit-project \
            --no-emit-package clusy-native \
            --no-emit-package mineru-html \
            --output-file "${RUNNER_TEMP}/quality-requirements.txt" \
            >/dev/null
          uv run python scripts/check_quality_runtime_requirements.py \
            --requirements "${RUNNER_TEMP}/quality-requirements.txt" \
            --manifest scripts/quality_runtime_packages.txt

      - name: Rust format
        run: cargo +1.85 fmt --manifest-path native/Cargo.toml --check

      - name: Rust clippy
        run: cargo +1.85 clippy --manifest-path native/Cargo.toml --locked --all-targets -- -D warnings

      - name: Rust tests
        run: cargo +1.85 test --manifest-path native/Cargo.toml --locked

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Pytest
        run: uv run pytest -q

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build static runtime image
        run: >-
          docker build
          --build-arg GIT_SHA="${GITHUB_SHA}"
          --target static-runtime
          --tag clusy-crawler:static-ci
          .

      - name: Verify static boundary, image identity, and licenses
        run: |
          set -euo pipefail
          test "$(docker image inspect clusy-crawler:static-ci --format '{{.Config.User}}')" = "crawler"
          docker image inspect clusy-crawler:static-ci --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | grep -Fx "GIT_SHA=${GITHUB_SHA}"
          docker image inspect clusy-crawler:static-ci --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | grep -Fx "PLAYWRIGHT_ENABLED=false"
          docker image inspect clusy-crawler:static-ci --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | grep -Fx "PLAYWRIGHT_JAVA_SCRIPT_ENABLED=false"
          test "$(docker image inspect clusy-crawler:static-ci --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = \
            "https://github.com/clusy-io/clusy-crawler"
          test "$(docker image inspect clusy-crawler:static-ci --format '{{index .Config.Labels "org.opencontainers.image.licenses"}}')" = \
            "Apache-2.0"
          test "$(docker image inspect clusy-crawler:static-ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = \
            "${GITHUB_SHA}"
          docker run --rm --entrypoint python clusy-crawler:static-ci -c \
            "import importlib.util as i; assert i.find_spec('playwright') is None; import app.main"
          docker run --rm --entrypoint sh clusy-crawler:static-ci -c \
            "test ! -e /ms-playwright \
             && test ! -e /usr/local/sbin/chrome-devel-sandbox \
             && ! command -v chromium >/dev/null 2>&1 \
             && ! command -v chromium-browser >/dev/null 2>&1 \
             && ! command -v google-chrome >/dev/null 2>&1"
          for notice in LICENSE NOTICE THIRD_PARTY_LICENSES.md; do
            docker run --rm --entrypoint test clusy-crawler:static-ci -r "/licenses/${notice}"
          done
          for notice in \
            /licenses/native-vendor/NOTICE.md \
            /licenses/native-vendor/rs-trafilatura/LICENSE-APACHE \
            /licenses/native-vendor/rs-trafilatura/LICENSE-MIT \
            /licenses/native-vendor/rs-trafilatura-broad/LICENSE-APACHE \
            /licenses/native-vendor/rs-trafilatura-broad/LICENSE-MIT \
            /licenses/native-vendor/html-cleaning/LICENSE-APACHE \
            /licenses/native-vendor/html-cleaning/LICENSE-MIT \
            /licenses/native-vendor/quick_html2md/LICENSE-APACHE \
            /licenses/native-vendor/quick_html2md/LICENSE-MIT; do
            docker run --rm --entrypoint test clusy-crawler:static-ci -r "${notice}"
          done

      - name: Smoke static auth, SSRF, and crawl paths
        run: |
          set -euo pipefail
          docker run --detach --name clusy-crawler-static-ci \
            --publish 127.0.0.1:11235:11235 \
            --user 10001:10001 --init --read-only \
            --tmpfs /tmp:size=512m,mode=1777 \
            --tmpfs /home/crawler:size=64m,mode=0700,uid=10001,gid=10001 \
            --security-opt no-new-privileges:true \
            --security-opt "seccomp=${PWD}/seccomp_profile.json" \
            --cap-drop ALL \
            --pids-limit=256 --memory=4g --cpus=2 \
            --env-file .env.example \
            --env ENVIRONMENT=prod \
            --env GIT_SHA="${GITHUB_SHA}" \
            --env CRAWLER_API_TOKEN=ci-smoke-token \
            --env SERVING_FINGERPRINT_KEY=ci-fingerprint-key-0123456789abcdef \
            clusy-crawler:static-ci

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11235/health/ready > /tmp/static-ready.json; then
              break
            fi
            if [ "${attempt}" = 60 ]; then
              docker logs clusy-crawler-static-ci
              exit 1
            fi
            sleep 1
          done
          jq -e \
            '.status == "ready" and (.checks | has("playwright") | not)' \
            /tmp/static-ready.json
          curl --fail --silent http://127.0.0.1:11235/health/version \
            | jq -e \
              '.playwright_enabled == false and .playwright_version == "not installed"'

          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'content-type: application/json' \
            --data '{"urls":["https://example.com"]}' \
            http://127.0.0.1:11235/crawl)" = "401"

          curl --fail --silent \
            --header 'authorization: Bearer ci-smoke-token' \
            --header 'content-type: application/json' \
            --data '{"urls":["http://169.254.169.254/latest/meta-data/"]}' \
            http://127.0.0.1:11235/crawl \
            | jq -e '.status == "ok" and (.results[0].error | length > 0)'

          curl --fail --silent \
            --header 'authorization: Bearer ci-smoke-token' \
            --header 'content-type: application/json' \
            --data '{"urls":["https://example.com"],"js_render":false,"extraction_profile":"balanced","max_age":0,"store_in_cache":false}' \
            http://127.0.0.1:11235/crawl \
            | jq -e \
              '.status == "ok" and .results[0].error == null and .results[0].metadata.rendered == false and .results[0].metadata.cache_status == "live" and .results[0].metadata.cache_policy == "no_store" and (.results[0].markdown | length > 0)'
          curl --fail --silent \
            --header 'authorization: Bearer ci-smoke-token' \
            --header 'content-type: application/json' \
            --data '{"urls":["http://127.0.0.1/private"],"max_age":0,"store_in_cache":false}' \
            http://127.0.0.1:11235/crawl \
            | jq -e \
              '.status == "ok" and (.results[0].error | type == "string" and length > 0)'
          docker rm --force clusy-crawler-static-ci

      - name: Build browser runtime image
        run: >-
          docker build
          --build-arg GIT_SHA="${GITHUB_SHA}"
          --target browser-runtime
          --tag clusy-crawler:browser-ci
          .

      - name: Verify sandboxed browser runtime and JavaScript rendering
        run: |
          set -euo pipefail
          test "$(docker image inspect clusy-crawler:browser-ci --format '{{.Config.User}}')" = "crawler"
          docker run --rm --entrypoint python clusy-crawler:browser-ci -c \
            "import importlib.util as i; assert i.find_spec('playwright') is not None"
          docker run --rm --entrypoint sh clusy-crawler:browser-ci -c \
            "test -d /ms-playwright \
             && test -u /usr/local/sbin/chrome-devel-sandbox \
             && find /ms-playwright -type f -name chrome -print -quit | grep -q ."

          docker run --detach --name clusy-crawler-browser-ci \
            --publish 127.0.0.1:11235:11235 \
            --user 10001:10001 --init --read-only --shm-size=1g \
            --tmpfs /tmp:size=512m,mode=1777 \
            --tmpfs /home/crawler:size=64m,mode=0700,uid=10001,gid=10001 \
            --security-opt no-new-privileges:true \
            --security-opt "seccomp=${PWD}/seccomp_profile.json" \
            --cap-drop ALL \
            --cap-add SYS_CHROOT \
            --pids-limit=256 --memory=4g --cpus=2 \
            --env ENVIRONMENT=prod \
            --env GIT_SHA="${GITHUB_SHA}" \
            --env CRAWLER_API_TOKEN=ci-smoke-token \
            --env SERVING_FINGERPRINT_KEY=ci-fingerprint-key-0123456789abcdef \
            clusy-crawler:browser-ci

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11235/health/ready > /tmp/browser-ready.json; then
              break
            fi
            if [ "${attempt}" = 60 ]; then
              docker logs clusy-crawler-browser-ci
              exit 1
            fi
            sleep 1
          done
          jq -e \
            '.status == "ready" and .checks.playwright == "ok"' \
            /tmp/browser-ready.json
          curl --fail --silent \
            --header 'authorization: Bearer ci-smoke-token' \
            --header 'content-type: application/json' \
            --data '{"urls":["https://example.com"],"js_render":true,"extraction_profile":"balanced","max_age":0,"store_in_cache":false}' \
            http://127.0.0.1:11235/crawl \
            | jq -e \
              '.status == "ok" and .results[0].error == null and .results[0].metadata.rendered == true and .results[0].metadata.cache_status == "live" and .results[0].metadata.cache_policy == "no_store"'
          docker rm --force clusy-crawler-browser-ci

      - name: Build quality runtime image
        run: >-
          docker build
          --build-arg GIT_SHA="${GITHUB_SHA}"
          --target quality-runtime
          --tag clusy-crawler:quality-ci
          .

      - name: Verify bounded quality runtime
        run: |
          set -euo pipefail
          test "$(docker image inspect clusy-crawler:quality-ci --format '{{.Config.User}}')" = "crawler"
          # Docker reports compressed/content-store size on some local
          # containerd-backed engines and unpacked layer bytes with the classic
          # Linux graph driver used by GitHub runners. Gate the exact CI
          # platform's host-disk footprint, and print both the value and limit
          # so a regression is diagnosable rather than an unexplained `test 1`.
          image_size=$(docker image inspect clusy-crawler:quality-ci --format '{{.Size}}')
          image_size_limit=2000000000
          echo "quality_image_size_bytes=${image_size} limit=${image_size_limit}"
          if [ "${image_size}" -gt "${image_size_limit}" ]; then
            echo "Quality runtime exceeds the Linux CI unpacked-size budget"
            exit 1
          fi
          docker run --rm --network none -i --read-only \
            --tmpfs /tmp:size=128m,mode=1777 \
            --tmpfs /home/crawler:size=16m,mode=0700,uid=10001,gid=10001 \
            --security-opt no-new-privileges:true \
            --security-opt "seccomp=${PWD}/seccomp_profile.json" \
            --cap-drop ALL --pids-limit=128 --memory=1g --cpus=1 \
            --entrypoint python clusy-crawler:quality-ci - \
            < scripts/smoke_quality_runtime.py

          docker network create clusy-quality-ci-net
          docker run --detach --name clusy-quality-stub-ci \
            --network clusy-quality-ci-net --network-alias quality-stub \
            --init --read-only --no-healthcheck \
            --security-opt no-new-privileges:true \
            --security-opt "seccomp=${PWD}/seccomp_profile.json" \
            --cap-drop ALL \
            --pids-limit=64 --memory=256m --cpus=0.5 \
            --volume "${PWD}/scripts/quality_openai_stub.py:/tmp/quality_openai_stub.py:ro" \
            --entrypoint python \
            clusy-crawler:quality-ci /tmp/quality_openai_stub.py

          docker run --detach --name clusy-crawler-quality-ci \
            --publish 127.0.0.1:11236:11235 \
            --network clusy-quality-ci-net \
            --user 10001:10001 --init --read-only --shm-size=1g \
            --tmpfs /tmp:size=512m,mode=1777 \
            --tmpfs /home/crawler:size=64m,mode=0700,uid=10001,gid=10001 \
            --security-opt no-new-privileges:true \
            --security-opt "seccomp=${PWD}/seccomp_profile.json" \
            --cap-drop ALL \
            --cap-add SYS_CHROOT \
            --pids-limit=256 --memory=4g --cpus=2 \
            --env ENVIRONMENT=prod \
            --env GIT_SHA="${GITHUB_SHA}" \
            --env CRAWLER_API_TOKEN=ci-smoke-token \
            --env SERVING_FINGERPRINT_KEY=ci-fingerprint-key-0123456789abcdef \
            --env QUALITY_EXTRACTION_BASE_URL=http://quality-stub:8000/v1 \
            --env QUALITY_EXTRACTION_API_KEY=ci-quality-key \
            --env QUALITY_EXTRACTION_MODEL=ci-quality-model \
            --env QUALITY_EXTRACTION_BACKEND_REVISION=ci-quality-revision \
            --env QUALITY_EXTRACTION_PROMPT_PROFILE=openai_json \
            clusy-crawler:quality-ci

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11236/health/ready > /tmp/quality-ready.json; then
              break
            fi
            if [ "${attempt}" = 60 ]; then
              docker logs clusy-crawler-quality-ci
              exit 1
            fi
            sleep 1
          done
          jq -e \
            '.status == "ready" and .checks.quality_backend == "ok"' \
            /tmp/quality-ready.json
          curl --fail --silent http://127.0.0.1:11236/health/version \
            | jq -e \
              '.quality_dependency_available == true and .quality_backend_enabled == true and .quality_source_selection_schema == "quality-source-selection-serialization.v1"'
          docker exec -i clusy-crawler-quality-ci python - \
            < scripts/smoke_configured_quality_backend.py
          docker exec -i \
            --env QUALITY_EXTRACTION_PROMPT_PROFILE=mineru_compact \
            clusy-crawler-quality-ci python - \
            < scripts/smoke_configured_quality_backend.py
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'content-type: application/json' \
            --data '{"urls":["https://example.com"]}' \
            http://127.0.0.1:11236/crawl)" = "401"
          curl --fail --silent \
            --header 'authorization: Bearer ci-smoke-token' \
            --header 'content-type: application/json' \
            --data '{"urls":["https://example.com"],"js_render":false,"extraction_profile":"quality","max_age":0,"store_in_cache":false}' \
            http://127.0.0.1:11236/crawl \
            | jq -e '
              .status == "ok" and
              .results[0].error == null and
              .results[0].metadata.model_assisted == true and
              .results[0].metadata.quality_succeeded == true and
              .results[0].metadata.source_selection_schema == "quality-source-selection-serialization.v1" and
              .results[0].metadata.source_selection_replay_verified == true and
              .results[0].metadata.source_selection_item_count == 3 and
              .results[0].metadata.source_selection_selected_count == 3 and
              (.results[0].metadata.source_selection_receipt_sha256 | test("^[0-9a-f]{64}$")) and
              .results[0].metadata.cache_status == "live" and
              .results[0].metadata.cache_policy == "no_store"'

      - name: Stop smoke containers
        if: always()
        run: |
          set -euo pipefail
          docker rm --force clusy-crawler-static-ci 2>/dev/null || true
          docker rm --force clusy-crawler-browser-ci 2>/dev/null || true
          docker rm --force clusy-crawler-quality-ci 2>/dev/null || true
          docker rm --force clusy-quality-stub-ci 2>/dev/null || true
          docker network rm clusy-quality-ci-net 2>/dev/null || true
