[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "clusy-native"
version = "0.1.0"
description = "Native extraction backend for Clusy Crawler"
license = "Apache-2.0"
requires-python = ">=3.12"

[tool.maturin]
python-source = "python"
module-name = "clusy_native._native"
features = ["pyo3/extension-module"]
